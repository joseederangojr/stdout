[package]
name = "stdout"
version = "0.1.0"
edition = "2021"
description = "Terminal client scaffold for dev-null.sh"

[dependencies]
anyhow = "1"
base64 = "0.23"
crossterm = "0.28"
getrandom = "0.3"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
url = "2"
webbrowser = "1"
