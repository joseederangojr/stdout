[package]
name = "stdout"
version = "0.1.0"
edition = "2021"
description = "Terminal client for dev-null.sh"

[dependencies]
base64 = "0.22"
crossterm = "0.28"
libc = "0.2"
rand = "0.8"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
time = { version = "0.3", features = ["parsing", "formatting"] }
toml = "0.8"
